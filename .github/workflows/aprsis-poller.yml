name: KCGR APRS-IS Poller
# Connects to APRS-IS directly (not Graywolf's local API - unreachable
# from a GitHub-hosted runner) and listens for KCGR-* object beacons.
# See kcgr_aprsis_poller.py's docstring for full design rationale.
#
# LIVE ON THE PUBLIC MAP as of 8/14/2026: this workflow writes
# backups/records_backup_aprsis.json, which merge-and-publish.yml now
# reads and merges alongside the Pi's own APRS file and Winlink. This
# workflow's name (exactly "KCGR APRS-IS Poller") is listed in
# merge-and-publish.yml's `workflow_run: workflows: [...]` trigger, and
# this file's path is listed in that workflow's `push: paths: [...]` -
# both confirmed against the real file contents, not assumed. Keep
# this workflow's `name:` field and merge-and-publish.yml's
# `workflow_run` list in sync if either is ever renamed - a mismatch
# there fails exactly as silently as the GITHUB_TOKEN trigger bug
# documented in merge-and-publish.yml.
#
# No repository secret is required - APRS-IS receive-only login
# (passcode -1) needs no real credential. APRSIS_CALLSIGN is not a
# secret; it defaults to the club's own callsign inside the script.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes, UTC - same cadence as
                              # the Winlink poller, comfortably longer
                              # than the ~75s listen window below
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    # Hard outer ceiling, independent of anything the script itself does.
    # A normal run (checkout + setup + install + ~75s listen + commit)
    # finishes well under 3 minutes; this exists so a future connection
    # problem - a login failure retried forever, a network hang, an
    # APRS-IS outage - fails loudly within a few minutes instead of
    # silently burning Actions minutes for hours. Confirmed necessary
    # 8/13/2026: a real run hit exactly this failure mode (a passcode
    # type bug caused every login attempt to fail, and aprslib's
    # blocking=True retries a failed login forever with no cap) and ran
    # for 8.5+ minutes before being manually cancelled.
    timeout-minutes: 6
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run APRS-IS poller
        # Should finish in ~75-90s (the listen window) plus a few
        # seconds of connection overhead. A tighter ceiling than the
        # job-level one above, so a hang here is unambiguous - it's this
        # step, not checkout/install/commit - and shows up in well under
        # the job's own 6-minute limit rather than being lost in it.
        timeout-minutes: 3
        run: python3 -u kcgr_aprsis_poller.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "kcgr-aprsis-poller"
          git config user.email "actions@github.com"
          if [ ! -f backups/records_backup_aprsis.json ]; then
            echo "No records file yet - nothing heard this run, nothing to commit."
            exit 0
          fi
          git add backups/records_backup_aprsis.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "APRS-IS poller: update comparison records"
            git push origin main
          fi
