name: KCGR Winlink Report Removal

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'List current reports, or remove one?'
        required: true
        type: choice
        options:
          - list
          - remove
        default: list
      identity:
        description: 'Exact identity to remove (only needed for "remove" -- run with action=list first to find it)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  winlink-removal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List current Winlink reports
        if: ${{ github.event.inputs.action == 'list' }}
        run: python3 kcgr_winlink_remove.py --list

      - name: Remove a Winlink report
        if: ${{ github.event.inputs.action == 'remove' }}
        run: |
          if [ -z "${{ github.event.inputs.identity }}" ]; then
            echo "::error::action=remove requires the identity input to be filled in. Run this workflow again with action=list first to find the exact identity string."
            exit 1
          fi
          python3 kcgr_winlink_remove.py "${{ github.event.inputs.identity }}"

      - name: Commit and push the removal
        if: ${{ github.event.inputs.action == 'remove' }}
        run: |
          git config user.name "kcgr-winlink-remove"
          git config user.email "actions@github.com"
          git add winlink/records.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Winlink removal: ${{ github.event.inputs.identity }}"
            git push origin main
          fi
