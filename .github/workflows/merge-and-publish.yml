name: KCGR Merge and Publish

# Fires automatically whenever EITHER channel's data changes - the
# APRS pipeline's backup push (from the Pi, via geojson_writer.py) or
# the Winlink poller's scheduled push. This keeps propagation fast
# (an Actions run, not a fixed polling delay) without a second writer
# racing on the same file - this workflow only runs when its own
# inputs change, nothing else ever writes kcgr_resource_feed.geojson.
on:
  push:
    branches: [main]
    paths:
      - "backups/records_backup.json"
      - "winlink/records.json"
  workflow_dispatch: {}   # manual trigger, for testing

permissions:
  contents: write

# Fixes a real bug found 8/12/2026: multiple pushes close together (e.g.
# a removal and a poller pickup within minutes of each other) each
# trigger their own separate run. Without this, an OLDER run - checked
# out against an earlier repo state - could finish AFTER a newer run
# and commit its stale results right on top of the correct, fresher
# ones, with no error anywhere to show it happened. This actually
# occurred: a correct HW report was briefly published, then silently
# overwritten by an older run re-publishing the previous data.
#
# `group` scopes this to the merge workflow specifically (a push
# elsewhere in the repo won't cancel an in-progress merge run).
# `cancel-in-progress: true` means if a newer run starts while an older
# one is still going, the older one is cancelled outright rather than
# left to finish and race for last-write. Safe to cancel here since
# nothing gets pushed until the final "commit and push" step actually
# completes - an in-progress cancellation never leaves a half-written
# commit behind.
concurrency:
  group: kcgr-merge-and-publish
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge and publish public map
        run: python3 kcgr_merge_and_publish.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "kcgr-merge-publish"
          git config user.email "actions@github.com"
          git add kcgr_resource_feed.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Merge step: update public map"
            git push origin main
          fi
