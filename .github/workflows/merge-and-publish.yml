name: KCGR Merge and Publish

# Fires automatically whenever any channel's data changes.
#
# APRS side (Pi-hosted): the Pi pushes backups/records_backup.json using its own
# SSH deploy key (not GITHUB_TOKEN), so GitHub's normal `push` trigger
# fires correctly for that channel - no change needed here.
#
# APRS-IS side: kcgr_aprsis_poller.py pushes backups/records_backup_aprsis.json
# using the default GITHUB_TOKEN, same as the Winlink poller below - so it
# needs the same workflow_run trigger to fire reliably, not just push/paths.
#
# Winlink side: kcgr_winlink_poller.py and kcgr_winlink_remove.py both
# push using the default GITHUB_TOKEN. GitHub deliberately does not
# let a GITHUB_TOKEN-authored push trigger another `on: push` workflow
# (anti-recursion safeguard) - confirmed 8/12/2026 as a real, live gap:
# every Winlink-side update or removal silently failed to auto-trigger
# this workflow, even though the `push`/`paths` trigger below looked
# correct on paper. Four manual merge runs earlier today were masking
# this. Fixed by adding a `workflow_run` trigger below, which is NOT
# subject to the same restriction - it fires off the *completion* of
# the upstream workflow itself, regardless of what token that workflow
# used to push.
on:
  push:
    branches: [main]
    paths:
      - "backups/records_backup.json"
      - "backups/records_backup_aprsis.json"
      - "winlink/records.json"
  workflow_run:
    workflows: ["KCGR Winlink Poller", "KCGR Winlink Report Removal", "KCGR APRS-IS Poller", "KCGR APRS-IS Report Removal"]
    types: [completed]
  workflow_dispatch: {}   # manual trigger, for testing
permissions:
  contents: write
# Fixes a real bug found 8/12/2026: multiple pushes close together (e.g.
# a removal and a poller pickup within minutes of each other) each
# trigger their own separate run. Without this, an OLDER run - checked
# out against an earlier repo state - could finish AFTER a newer run
# and commit its stale results right on top of the correct, fresher
# ones, with no error anywhere to show it happened. This actually
# occurred: a correct HW report was briefly published, then silently
# overwritten by an older run re-publishing the previous data.
#
# `group` scopes this to the merge workflow specifically (a push
# elsewhere in the repo won't cancel an in-progress merge run).
# `cancel-in-progress: true` means if a newer run starts while an older
# one is still going, the older one is cancelled outright rather than
# left to finish and race for last-write. Safe to cancel here since
# nothing gets pushed until the final "commit and push" step actually
# completes - an in-progress cancellation never leaves a half-written
# commit behind.
concurrency:
  group: kcgr-merge-and-publish
  cancel-in-progress: true
jobs:
  merge:
    # Guard for the workflow_run trigger: only proceed if the
    # upstream workflow actually completed successfully. A
    # failed poller/removal run has nothing new worth merging, and
    # this skips a wasted run rather than silently no-op'ing inside
    # the Python script. Ordinary push and workflow_dispatch triggers
    # aren't workflow_run events at all, so they're unaffected by this
    # condition and always proceed as before.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Merge and publish public map
        run: python3 kcgr_merge_and_publish.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "kcgr-merge-publish"
          git config user.email "actions@github.com"
          git add kcgr_resource_feed.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Merge step: update public map"
            git push origin main
          fi
